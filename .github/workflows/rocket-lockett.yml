# Rocket Lockett's server image: built on every change to it or to AIBot, then started with a
# fresh world to check that Paper and every plugin load and the map answers. A tag
# rocket-lockett-vX.Y.Z also publishes ghcr.io/vmenon04/rocket-lockett:X.Y.Z.
name: rocket-lockett

on:
  push:
    branches: [main]
    paths: [aibot/**, servers/rocket-lockett/**, .github/workflows/rocket-lockett.yml]
    tags: [rocket-lockett-v*]
  # Also by hand (Actions tab), e.g. to check a build without a change.
  workflow_dispatch:
  pull_request:
    paths: [aibot/**, servers/rocket-lockett/**, .github/workflows/rocket-lockett.yml]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/rocket-lockett
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -f servers/rocket-lockett/Dockerfile -t "$IMAGE:test" .
      - name: It starts, with every plugin
        run: |
          docker run -d --name mc -p 8100:8100 -e EULA=TRUE -e ONLINE_MODE=FALSE \
            -e MAX_MEMORY=2G -e LEVEL_TYPE=minecraft:flat "$IMAGE:test"
          for i in $(seq 1 120); do
            docker logs mc 2>&1 | grep -q 'Done (' && break
            sleep 5
          done
          docker logs mc 2>&1 | tail -n 40
          docker logs mc 2>&1 | grep -q 'Done (' || { echo "::error::the server didn't start"; exit 1; }
          for plugin in AIBot Essentials BlueMap voicechat; do
            docker logs mc 2>&1 | grep -q "Enabling $plugin" || { echo "::error::$plugin didn't load"; exit 1; }
          done
          if docker logs mc 2>&1 | grep -E 'Could not load|Error occurred while enabling'; then
            echo "::error::a plugin failed to load"; exit 1
          fi
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8100/ && break; sleep 2; done
          curl -sf -o /dev/null http://127.0.0.1:8100/ || { echo "::error::BlueMap's web server didn't answer"; exit 1; }
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/rocket-lockett-v')
        run: |
          version=${GITHUB_REF_NAME#rocket-lockett-v}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:test" "$IMAGE:$version"
          docker push "$IMAGE:$version"
