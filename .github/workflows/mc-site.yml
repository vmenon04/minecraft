# mc-site: tested and built on every change to mc-site/. A tag mc-site-vX.Y.Z also publishes
# ghcr.io/vmenon04/mc-site:X.Y.Z.
name: mc-site

on:
  push:
    branches: [main]
    paths: [mc-site/**, .github/workflows/mc-site.yml]
    tags: [mc-site-v*]
  # Also by hand (Actions tab), e.g. to check a build without a change.
  workflow_dispatch:
  pull_request:
    paths: [mc-site/**, .github/workflows/mc-site.yml]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mc-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/mc-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t "$IMAGE:test" mc-site
      - name: It answers
        run: |
          docker run -d --name site -p 8000:8000 "$IMAGE:test"
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8000/api/status && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/api/status

  # Only a release tag gets to publish, and only after the tests and the image check passed.
  publish:
    needs: image
    if: startsWith(github.ref, 'refs/tags/mc-site-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub Release
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/mc-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the earlier tags, for the release notes
      - run: |
          version=${GITHUB_REF_NAME#mc-site-v}
          docker build -t "$IMAGE:$version" mc-site
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$version"
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#mc-site-v}
          printf 'Image: `%s`\n' "$IMAGE:$version" > notes.md
          # Notes from this component's previous release, not whichever tag in the repo came last.
          prev=$(git tag --list 'mc-site-v*' --sort=-v:refname | grep -vxF "$GITHUB_REF_NAME" | head -n 1)
          gh release create "$GITHUB_REF_NAME" --title "mc-site $version" --notes-file notes.md \
            --generate-notes ${prev:+--notes-start-tag "$prev"} --latest=false
