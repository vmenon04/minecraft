# BlueMap's core settings for Rocket Lockett, synced into plugins/BlueMap/ at each start.
# Settings not listed here keep BlueMap's defaults.

# BlueMap downloads Minecraft's textures from Mojang to render the map. Setting this to true
# accepts Mojang's terms for that download: https://www.minecraft.net/en-us/eula
accept-download: true

# flatboy has 4 cores and Minecraft needs most of one; BlueMap's own guidance for 4 cores or
# fewer is a single render thread. The first full render is slow; later ones only redraw
# what changed.
render-thread-count: 1
